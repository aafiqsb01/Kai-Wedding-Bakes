AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Opulence Wedding Bakes DB functions
Globals:
  Function:
    Timeout: 60
    MemorySize: 256
    Runtime: nodejs18.x
    Environment:
      Variables:
        AWS_DYNAMODB_TABLE_ENQUIRIES: opulence-wedding-bakes-enquiries
        AWS_DYNAMODB_TABLE_GALLERY: opulence-wedding-bakes-gallery
        AWS_S3_BUCKET_NAME: opulence-wedding-bakes-photos
        CONTACT_FORM_RECIPIENT_EMAIL: opulenceweddingcakes@gmail.com
Resources:
  ContactFormHandlerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - functions/contact-form-handler/index.ts
        External:
        - aws-sdk
        Format: cjs
        Minify: false
        Sourcemap: true
        Target: es2020
      SamResourceId: ContactFormHandlerFunction
    Properties:
      FunctionName: opulence-contact-form-handler
      CodeUri: ContactFormHandlerFunction
      Handler: index.handler
      Runtime: nodejs18.x
      Role: arn:aws:iam::640168417037:role/opulence-wedding-bakes-dbaccess-role
      Policies:
      - DynamoDBCrudPolicy:
          TableName: opulence-wedding-bakes-enquiries
      Environment:
        Variables:
          AWS_DYNAMODB_TABLE_ENQUIRIES: opulence-wedding-bakes-enquiries
          NODE_OPTIONS: ' --enable-source-maps'
  InstagramSyncFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - functions/instagram-sync/index.ts
        External:
        - aws-sdk
        Format: cjs
        Minify: false
        Sourcemap: true
        Target: es2020
      SamResourceId: InstagramSyncFunction
    Properties:
      FunctionName: opulence-instagram-sync
      CodeUri: InstagramSyncFunction
      Handler: index.handler
      Runtime: nodejs18.x
      Role: arn:aws:iam::640168417037:role/opulence-wedding-bakes-dbaccess-role
      Timeout: 300
      MemorySize: 512
      Policies:
      - DynamoDBCrudPolicy:
          TableName: opulence-wedding-bakes-gallery
      - S3CrudPolicy:
          BucketName: opulence-wedding-bakes-photos
      Environment:
        Variables:
          AWS_DYNAMODB_TABLE_GALLERY: opulence-wedding-bakes-gallery
          AWS_S3_BUCKET_NAME: opulence-wedding-bakes-photos
          NODE_OPTIONS: ' --enable-source-maps'
